name: Verify
on:
  pull_request:
  push:
    branches: [main, dev, feature/service-redesign, feature/coffee-records-handoff]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - run: node scripts/security-source-check.mjs
        working-directory: .
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Prepare pre-upgrade database fixture
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git show "$BASE_SHA:backend/pom.xml" | grep -q '<version>3.4.1</version>'; then
            mkdir -p "$RUNNER_TEMP/rr-baseline"
            git archive "$BASE_SHA" | tar -x -C "$RUNNER_TEMP/rr-baseline"
            mvn -B -DskipTests -f "$RUNNER_TEMP/rr-baseline/backend/pom.xml" package
            echo "RR_BASELINE_JAR=$RUNNER_TEMP/rr-baseline/backend/target/roast-and-reverb-backend-0.1.0.jar" >> "$GITHUB_ENV"
          fi
      - run: mvn -B -f backend/pom.xml verify
      - run: node backend/scripts/verify-production.mjs

  deployment-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t roast-reverb-service:check .

      - name: Verify hosted app starts with persistent storage
        run: |
          mkdir -p "$RUNNER_TEMP/rr-volume"
          docker run -d --name rr-check --memory=500m --cpus=1 \
            -e SPRING_PROFILES_ACTIVE=production \
            -e JWT_SECRET="$(openssl rand -hex 48)" \
            -p 127.0.0.1:8187:8080 \
            -v "$RUNNER_TEMP/rr-volume:/data" roast-reverb-service:check
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8187/healthz > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8187/healthz
          curl -fsS http://127.0.0.1:8187/ | grep -F 'Roast & Reverb'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8187/api/coffee)" = 401
      - name: Read-only security acceptance checks
        run: node scripts/security-readonly.mjs http://127.0.0.1:8187
      - name: Scan runtime dependencies for fixable high and critical vulnerabilities
        run: |
          mkdir -p "$RUNNER_TEMP/security-reports"
          chmod 777 "$RUNNER_TEMP/security-reports"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$RUNNER_TEMP/security-reports:/reports" aquasec/trivy:0.76.0 image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --format json --output /reports/trivy.json roast-reverb-service:check
      - name: ZAP passive baseline against isolated service
        run: |
          mkdir -p "$RUNNER_TEMP/security-reports"
          chmod 777 "$RUNNER_TEMP/security-reports"
          docker run --rm --network host -v "$RUNNER_TEMP/security-reports:/zap/wrk/:rw" ghcr.io/zaproxy/zaproxy:stable zap-baseline.py -t http://127.0.0.1:8187 -m 1 -T 3 -I -r zap.html -J zap.json
      - name: Upload isolated security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isolated-security-reports
          path: ${{ runner.temp }}/security-reports
          retention-days: 7
      - if: failure()
        run: docker logs rr-check
      - if: always()
        run: docker rm -f rr-check || true
