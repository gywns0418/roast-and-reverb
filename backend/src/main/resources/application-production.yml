spring:
  datasource:
    url: jdbc:h2:file:/data/roastreverb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=MEMBER,BODY;WRITE_DELAY=0
  sql:
    init:
      mode: always
      data-locations: classpath:production-data.sql
app:
  jwt:
    secret: ${JWT_SECRET}
  claude:
    model: ${CLAUDE_MODEL:claude-haiku-4-5-20251001}
server:
  forward-headers-strategy: framework
